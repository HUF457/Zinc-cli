name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-tree:
    name: Public tree and privacy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test release governance gates
        run: node --test app/tests/release/release-gates.test.mjs
      - run: node scripts/verify-public-tree.mjs

  app:
    name: Windows source build
    needs: public-tree
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run legal:check
      - run: npm run typecheck
      - run: npm run build
      - name: Run CDP regression smoke
        run: pwsh -NoProfile -File ./scripts/run-cdp-smoke.ps1
